  - name: trasparenza-en
    label: Trasparenza
    type: collection
    path: content/en/trasparenza
    format: toml-frontmatter
    delimiters: +++
    exclude:
    - _index.md
    filename:
      template: '{primary}.md'
      field: create
    fields:
    - name: title
      label: Titolo
      type: string
      description: Nome del progetto o del documento.
      required: true
    - name: date
      label: Data
      type: date
      description: Data di pubblicazione.
      options:
        time: true
        format: yyyy-MM-dd'T'HH:mm:ssXXX
    - name: draft
      label: Bozza (non pubblicare)
      type: boolean
      description: Se attiva, la voce resta salvata ma non compare sul sito.
      default: false
    - name: reviewed
      label: Traduzione rivista
      type: boolean
      description: Spunta quando una persona ha controllato la traduzione.
      default: false
    - name: year
      label: Anno
      type: number
      description: Anno sotto cui viene raggruppata la voce nella pagina.
      required: true
    - name: kind
      label: Tipo
      type: select
      description: Progetto finanziato oppure documento sugli aiuti pubblici.
      required: true
      options:
        values:
        - name: progetto
          label: Progetto
        - name: documento-aiuti
          label: Documento aiuti pubblici
    - name: program
      label: Programma
      type: string
      description: Per esempio «iNEST Spoke 3». Facoltativo.
    - name: funder
      label: Ente finanziatore
      type: string
      description: Facoltativo. Lascia vuoto se non serve.
    - name: amount
      label: Importo
      type: string
      description: Facoltativo. Scrivi l'importo come deve apparire.
    - name: description
      label: Descrizione
      type: text
      description: Facoltativa. Breve testo mostrato sotto il titolo.
    - name: image
      label: Locandina o immagine
      type: image
      description: Facoltativa. Locandina del progetto.
    - name: imageAlt
      label: Descrizione dell'immagine
      type: string
      description: Frase breve che descrive l'immagine, letta dagli screen reader.
    - name: file
      label: File PDF
      type: file
      description: Documento da scaricare.
      required: true
    - name: fileNote
      label: Nota accanto al link
      type: string
      description: Facoltativa. Per esempio «(document in Italian)».
    view:
      fields:
      - title
      - year
      - kind
      - draft
      primary: title
      sort:
      - year
      - date
      - title
      default:
        sort: date
        order: desc
    operations:
      create: true
      rename: false
      delete: false
  - name: trasparenza-pagina-en
    label: 'Trasparenza: titolo e banner'
    type: file
    path: content/en/trasparenza/_index.md
    format: toml-frontmatter
    delimiters: +++
    operations:
      delete: false
    fields:
    - name: title
      label: Titolo della pagina
      type: string
      description: Titolo mostrato in cima alla pagina.
    - name: reviewed
      label: Traduzione rivista
      type: boolean
      description: Spunta quando una persona ha controllato la traduzione.
      default: false
    - name: aliases
      label: Vecchi indirizzi
      type: string
      description: 'Non modificare: servono per i link del vecchio sito.'
      readonly: true
      list: true
    - name: banners
      label: Banner
      type: object
      description: Immagini mostrate in cima alla pagina.
      fields:
      - name: image
        label: Immagine
        type: image
        description: Banner.
      - name: imageAlt
        label: Descrizione dell'immagine
        type: string
        description: Frase breve letta dagli screen reader.
      list: true
