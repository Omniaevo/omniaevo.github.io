# Pages CMS configuration. Docs: https://pagescms.org/docs/configuration/
# Generated structure; edit by hand if needed. Not exposed: privacy, redirect pages, hugo.toml, data/.
media:
  input: static/uploads
  output: /uploads
  rename: safe
settings:
  content:
    merge: true
  commit:
    templates:
      create: 'content(create): {path}'
      update: 'content(update): {path}'
      delete: 'content(delete): {path}'
      rename: 'content(rename): {oldPath} -> {newPath}'
content:
- name: group-it
  label: Italiano
  type: group
  items:
  - name: home-it
    label: Home
    type: file
    path: content/it/_index.md
    format: toml-frontmatter
    delimiters: +++
    operations:
      delete: false
    fields:
    - name: title
      label: Titolo del sito
      type: string
      description: Nome mostrato nel titolo del browser.
    - name: description
      label: Descrizione per i motori di ricerca
      type: text
      description: Una o due frasi che descrivono il sito.
    - name: hero
      label: Apertura
      type: object
      description: Primo blocco della pagina.
      fields:
      - name: title
        label: Titolo
        type: string
        description: Frase principale.
      - name: highlight
        label: Parola evidenziata
        type: string
        description: Una parola del titolo, da scrivere esattamente come nel titolo. Riceve la banda arancio. Lasciare vuoto per non evidenziare.
      - name: text
        label: Testo sotto il titolo
        type: text
        description: Una o due frasi. Non ripetere il titolo. La descrizione per i motori di ricerca (sopra) è un campo separato.
      - name: ctaLabel
        label: Testo del pulsante
        type: string
        description: Per esempio «Scopri di più».
      - name: ctaAnchor
        label: Sezione di destinazione
        type: string
        description: 'Non modificare: identifica la sezione a cui porta il pulsante.'
        readonly: true
    - name: chiSiamo
      label: Chi siamo
      type: object
      description: Sezione sull'azienda.
      fields:
      - name: title
        label: Titolo della sezione
        type: string
        description: Titolo mostrato in cima alla sezione.
      - name: text
        label: Testo
        type: text
        description: Paragrafo di apertura.
      - name: mission
        label: Mission
        type: object
        fields:
        - name: title
          label: Titolo
          type: string
          description: Piccolo titolo, per esempio «Mission».
        - name: text
          label: Testo
          type: text
          description: Descrizione della missione.
      - name: vision
        label: Vision
        type: object
        fields:
        - name: title
          label: Titolo
          type: string
          description: Piccolo titolo, per esempio «Vision».
        - name: text
          label: Testo
          type: text
          description: Descrizione della visione.
      - name: historyTitle
        label: Titolo della storia
        type: string
        description: Piccolo titolo sopra la timeline, per esempio «Storia».
      - name: timeline
        label: Storia (timeline)
        type: object
        description: Una riga per anno, dal più vecchio al più recente.
        list: true
        fields:
        - name: year
          label: Anno
          type: string
          description: Per esempio «2015».
        - name: items
          label: Punti
          type: string
          description: Cosa è successo quell'anno, un punto per riga.
          list: true
    - name: cosaFacciamo
      label: Cosa facciamo
      type: object
      description: Sezione sulle attività.
      fields:
      - name: title
        label: Titolo della sezione
        type: string
        description: Titolo mostrato in cima alla sezione.
      - name: highlight
        label: Parola evidenziata
        type: string
        description: Una parola del titolo, da scrivere esattamente come nel titolo. Riceve la banda arancio. Lasciare vuoto per non evidenziare.
      - name: intro
        label: Introduzione
        type: object
        description: Testo di apertura.
        fields:
        - name: title
          label: Titolo
          type: string
          description: Titolo del blocco.
        - name: paragraphs
          label: Paragrafi
          type: text
          description: Un paragrafo per ogni voce.
          list: true
        - name: closing
          label: Paragrafo finale
          type: text
          description: Ultimo paragrafo dell'introduzione.
      - name: areas
        label: Aree di attività
        type: object
        description: Le sei aree, nell'ordine in cui compaiono.
        fields:
        - name: title
          label: Nome dell'area
          type: string
          description: Nome breve.
        - name: text
          label: Descrizione
          type: text
          description: Testo completo dell'area. Le prime righe compaiono sulla scheda, il resto al passaggio del mouse.
        list: true
      - name: lists
        label: Elenchi
        type: object
        description: Campi di attività (non mostrato), infrastrutture, programmazione, automazione, AI.
        fields:
        - name: title
          label: Titolo dell'elenco
          type: string
          description: Per esempio «Infrastrutture».
        - name: items
          label: Voci
          type: string
          description: Una voce per riga.
          list: true
        list: true
      - name: settoriIntro
        label: Titolo dei settori
        type: object
        fields:
        - name: title
          label: Titolo
          type: string
          description: Piccolo titolo sopra le schede, per esempio «Settori».
      - name: settori
        label: Settori
        type: object
        description: Una scheda per settore, tutte uguali. Per aggiungerne una (per esempio «Industriale») basta una voce in più.
        list: true
        fields:
        - name: title
          label: Nome del settore
          type: string
          description: Nome breve.
        - name: text
          label: Descrizione
          type: text
          description: Testo della scheda.
    - name: servizi
      label: Servizi (titolo)
      type: object
      description: Intestazione della sezione Servizi in home.
      fields:
      - name: title
        label: Titolo
        type: string
        description: Titolo della sezione.
      - name: intro
        label: Introduzione
        type: text
        description: Una riga sotto il sottotitolo «Come lavoriamo», nel blocco Servizi in fondo a Cosa facciamo.
      - name: downloads
        label: Scaricabili
        type: object
        description: File da scaricare nel gruppo «Assistenza clienti». Il manuale PEC si aggiunge da solo dal servizio PEC. Un file locale compare solo se esiste in static/.
        list: true
        fields:
        - name: title
          label: Titolo
          type: string
          description: Nome del file, per esempio «Assistenza remota».
        - name: file
          label: File
          type: file
          description: Carica il file oppure scrivi l'indirizzo (per l'assistenza remota «/omniaevoremote.exe»).
        - name: note
          label: Nota
          type: string
          description: Una riga che spiega a cosa serve. Facoltativa.
    - name: team
      label: Team
      type: object
      description: Sezione Team (terza striscia).
      fields:
      - name: title
        label: Titolo della sezione
        type: string
        description: Titolo mostrato in cima alla sezione.
      - name: highlight
        label: Parola evidenziata
        type: string
        description: Una parola del titolo, da scrivere esattamente come nel titolo. Riceve la banda arancio. Lasciare vuoto per non evidenziare.
      - name: quote
        label: Citazione
        type: text
        description: Frase grande sotto il titolo.
      - name: text
        label: Testo
        type: text
        description: Paragrafo sotto la citazione.
      - name: valuesTitle
        label: Titolo dei valori
        type: string
        description: Piccolo titolo sopra le tre schede, per esempio «Valori».
      - name: values
        label: Valori
        type: object
        description: Tre schede uguali. Più di tre vanno a capo.
        list: true
        fields:
        - name: title
          label: Titolo
          type: string
          description: Il valore, per esempio «Problem solving».
        - name: icon
          label: Icona
          type: select
          description: Icona mostrata nella scheda.
          options:
            values:
            - quality
            - problem
            - tailor
      - name: membersTitle
        label: Titolo delle persone
        type: string
        description: Piccolo titolo sopra i riquadri, per esempio «Le persone».
      - name: members
        label: Persone
        type: object
        description: Un riquadro per persona, nell'ordine in cui compaiono (ordine della struttura aziendale). Senza foto compare una sagoma.
        list: true
        fields:
        - name: name
          label: Nome e cognome
          type: string
          description: Una riga.
        - name: role
          label: Mansione
          type: string
          description: Breve, al massimo due righe.
        - name: featured
          label: Scheda grande
          type: boolean
          description: Se attiva, la scheda è grande come due righe e le altre le stanno accanto. Usarla per una sola persona, la prima della lista.
        - name: photo
          label: Foto
          type: image
          description: Verticale, rapporto 4:5 (per esempio 800×1000 px), JPG, sotto i 300 KB. Il ritaglio è uguale per tutti.
        - name: photoAlt
          label: Descrizione della foto
          type: string
          description: Testo alternativo. Se vuoto la foto è trattata come decorativa.
    - name: caseHistory
      label: Case history (titolo)
      type: object
      description: Intestazione della sezione Case history in home.
      fields:
      - name: title
        label: Titolo
        type: string
        description: Titolo della sezione.
      - name: highlight
        label: Parola evidenziata
        type: string
        description: Una parola del titolo, da scrivere esattamente come nel titolo. Riceve la banda arancio. Lasciare vuoto per non evidenziare.
      - name: intro
        label: Introduzione
        type: text
        description: Facoltativa. Testo sotto il titolo.
    - name: contatti
      label: Contatti
      type: object
      description: Testi della sezione contatti. Gli indirizzi email non sono qui.
      fields:
      - name: title
        label: Titolo
        type: string
        description: Titolo della sezione.
      - name: intro
        label: Introduzione
        type: text
        description: Frase sotto il titolo.
      - name: officeTitle
        label: Titolo «sede»
        type: string
        description: Titolo del blocco con indirizzo e telefono.
      - name: directTitle
        label: Titolo «contatti diretti»
        type: string
        description: Titolo dell'elenco delle email.
      - name: ctaText
        label: Frase finale
        type: text
        description: Frase prima del pulsante.
      - name: ctaLabel
        label: Testo del pulsante
        type: string
        description: Per esempio «CONTATTACI!».
  - name: case-history-it
    label: Case history
    type: collection
    path: content/it/case-history
    format: toml-frontmatter
    delimiters: +++
    exclude:
    - _index.md
    filename:
      template: '{primary}.md'
      field: create
    fields:
    - name: title
      label: Titolo
      type: string
      description: Nome del progetto. Compare nell'elenco e in cima alla pagina.
      required: true
    - name: date
      label: Data
      type: date
      description: Data di pubblicazione. Nell'elenco i più recenti stanno in alto.
      options:
        time: true
        format: yyyy-MM-dd'T'HH:mm:ssXXX
    - name: draft
      label: Bozza (non pubblicare)
      type: boolean
      description: Se attiva, la voce resta salvata ma non compare sul sito.
      default: false
    - name: description
      label: Sommario
      type: text
      description: Breve introduzione al progetto, mostrata in elenco e sotto il titolo.
    - name: image
      label: Immagine principale
      type: image
      description: Foto o schema che rappresenta il progetto.
    - name: imageAlt
      label: Descrizione dell'immagine
      type: string
      description: Frase breve che descrive l'immagine, letta dagli screen reader.
    - name: client
      label: Cliente
      type: string
      description: Facoltativo. Nome del cliente.
    - name: sector
      label: Settore
      type: string
      description: Facoltativo. Settore di attività del cliente.
    - name: areas
      label: Aree
      type: select
      description: Aree di competenza coinvolte nel progetto.
      options:
        multiple: true
        values:
        - name: engineering
          label: Engineering
        - name: network
          label: Network
        - name: research
          label: Research
        - name: systems
          label: Systems
        - name: software
          label: Software
        - name: web-apps
          label: Web Apps
    - name: body
      label: Testo
      type: rich-text
      description: Descrizione completa del progetto, con eventuali altre immagini.
    view:
      fields:
      - title
      - date
      - draft
      primary: title
      sort:
      - date
      - title
      default:
        sort: date
        order: desc
    operations:
      create: true
      rename: true
      delete: true
  - name: servizi-it
    label: Servizi
    type: collection
    path: content/it/servizi
    format: toml-frontmatter
    delimiters: +++
    exclude:
    - _index.md
    filename:
      template: '{primary}.md'
      field: create
    fields:
    - name: title
      label: Titolo
      type: string
      description: Nome del servizio.
      required: true
    - name: date
      label: Data
      type: date
      description: Data di pubblicazione.
      options:
        time: true
        format: yyyy-MM-dd'T'HH:mm:ssXXX
    - name: draft
      label: Bozza (non pubblicare)
      type: boolean
      description: Se attiva, la voce resta salvata ma non compare sul sito.
      default: false
    - name: weight
      label: Ordine
      type: number
      description: 'Numero che decide l''ordine: i numeri bassi vengono prima.'
    - name: description
      label: Sommario
      type: text
      description: Breve descrizione, mostrata in elenco e nella home.
    - name: image
      label: Immagine
      type: image
      description: Immagine del servizio.
    - name: imageAlt
      label: Descrizione dell'immagine
      type: string
      description: Frase breve che descrive l'immagine, letta dagli screen reader.
    - name: links
      label: Link
      type: object
      description: Collegamenti utili del servizio, per esempio un portale web.
      fields:
      - name: label
        label: Testo del link
        type: string
        description: Cosa leggerà l'utente.
      - name: url
        label: Indirizzo
        type: string
        description: Indirizzo completo, che inizia con https://.
      list: true
    - name: attachments
      label: Allegati
      type: object
      description: Documenti da scaricare, per esempio un manuale.
      fields:
      - name: label
        label: Nome del documento
        type: string
        description: Cosa leggerà l'utente.
      - name: file
        label: File
        type: file
        description: Carica un file oppure indica l'indirizzo di un documento esterno.
      list: true
    - name: services
      label: Servizi offerti
      type: string
      description: Elenco breve di voci, una per riga. Per i servizi numerati del blocco Servizi.
      list: true
    - name: body
      label: Testo
      type: rich-text
      description: Descrizione del servizio. Facoltativa.
    view:
      fields:
      - title
      - date
      - draft
      primary: title
      sort:
      - date
      - title
      default:
        sort: date
        order: desc
    operations:
      create: true
      rename: true
      delete: true
  - name: trasparenza-it
    label: Trasparenza
    type: collection
    path: content/it/trasparenza
    format: toml-frontmatter
    delimiters: +++
    exclude:
    - _index.md
    filename:
      template: '{primary}.md'
      field: create
    fields:
    - name: title
      label: Titolo
      type: string
      description: Nome del progetto o del documento.
      required: true
    - name: date
      label: Data
      type: date
      description: Data di pubblicazione.
      options:
        time: true
        format: yyyy-MM-dd'T'HH:mm:ssXXX
    - name: draft
      label: Bozza (non pubblicare)
      type: boolean
      description: Se attiva, la voce resta salvata ma non compare sul sito.
      default: false
    - name: year
      label: Anno
      type: number
      description: Anno sotto cui viene raggruppata la voce nella pagina.
      required: true
    - name: kind
      label: Tipo
      type: select
      description: Progetto finanziato oppure documento sugli aiuti pubblici.
      required: true
      options:
        values:
        - name: progetto
          label: Progetto
        - name: documento-aiuti
          label: Documento aiuti pubblici
    - name: program
      label: Programma
      type: string
      description: Per esempio «iNEST Spoke 3». Facoltativo.
    - name: funder
      label: Ente finanziatore
      type: string
      description: Facoltativo. Lascia vuoto se non serve.
    - name: amount
      label: Importo
      type: string
      description: Facoltativo. Scrivi l'importo come deve apparire.
    - name: description
      label: Descrizione
      type: text
      description: Facoltativa. Breve testo mostrato sotto il titolo.
    - name: image
      label: Locandina o immagine
      type: image
      description: Facoltativa. Locandina del progetto.
    - name: imageAlt
      label: Descrizione dell'immagine
      type: string
      description: Frase breve che descrive l'immagine, letta dagli screen reader.
    - name: file
      label: File PDF
      type: file
      description: Documento da scaricare.
      required: true
    - name: fileNote
      label: Nota accanto al link
      type: string
      description: Facoltativa. Per esempio «(document in Italian)».
    view:
      fields:
      - title
      - year
      - kind
      - draft
      primary: title
      sort:
      - year
      - date
      - title
      default:
        sort: date
        order: desc
    operations:
      create: true
      rename: false
      delete: false
  - name: trasparenza-pagina-it
    label: 'Trasparenza: titolo e banner'
    type: file
    path: content/it/trasparenza/_index.md
    format: toml-frontmatter
    delimiters: +++
    operations:
      delete: false
    fields:
    - name: title
      label: Titolo della pagina
      type: string
      description: Titolo mostrato in cima alla pagina.
    - name: highlight
      label: Parola evidenziata
      type: string
      description: Una parola del titolo, da scrivere esattamente come nel titolo. Riceve la banda arancio. Lasciare vuoto per non evidenziare.
    - name: aliases
      label: Vecchi indirizzi
      type: string
      description: 'Non modificare: servono per i link del vecchio sito.'
      readonly: true
      list: true
    - name: banners
      label: Banner
      type: object
      description: Immagini mostrate in cima alla pagina.
      fields:
      - name: image
        label: Immagine
        type: image
        description: Banner.
      - name: imageAlt
        label: Descrizione dell'immagine
        type: string
        description: Frase breve letta dagli screen reader.
      list: true
